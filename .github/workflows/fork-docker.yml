name: Fork Docker

# Fork-owned build of the Immich server image.
#
# The upstream `docker.yml` cannot run here: its `pre-job` needs the immich-app
# `PUSH_O_MATIC` GitHub App secrets, and the ML matrix pins the `rocm` variant to
# immich-app's self-hosted `pokedex-large` runner. This workflow builds only the
# server image (web + CLI + plugins are baked into it) and pushes it to the
# fork's own GHCR namespace. The machine-learning image is unmodified in this
# fork, so the deployment keeps pulling it from ghcr.io/immich-app.
#
# The server image bundles the APK from ghcr.io/<owner>/immich-apk:latest, so
# when the app's inputs change the APK is rebuilt first (fork-android.yml, called
# as a job) and the server build waits for it. Mobile-only changes still rebuild
# the server image, so it never ships a stale APK.
#
# See FORK.md for the full ledger of fork changes and the version-bump process.

on:
  push:
    branches: [orange-buffalo]
    paths-ignore: ['**.md', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      build_apk:
        description: Rebuild the Android APK before the server image
        type: boolean
        default: true

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/immich-server

jobs:
  changes:
    name: Detect APK changes
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.detect.outputs.apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_APK: ${{ inputs.build_apk }}
          BEFORE: ${{ github.event.before }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "apk=$BUILD_APK" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diffing two trees needs only those two commits, not the history between them.
          # A new branch or a force push can leave nothing to compare against, so rebuild.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 "$REPOSITORY_URL" "$BEFORE"; then
            echo "No previous commit to compare against, rebuilding the APK"
            echo "apk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # keep in sync with the inputs of fork-android.yml
          if git diff --name-only "$BEFORE" HEAD |
            grep -qE '^(mobile/|i18n/|open-api/|\.github/workflows/fork-android\.yml$)'; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.apk == 'true'
    uses: ./.github/workflows/fork-android.yml
    permissions:
      contents: read
      packages: write
    secrets:
      KEY_JKS: ${{ secrets.KEY_JKS }}
      ALIAS: ${{ secrets.ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

  server:
    name: Build and Push Server
    needs: [changes, android]
    # a skipped APK build is fine, the last published APK is still current
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.android.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate docker image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          # Single arch keeps the build under the hosted-runner budget. Add
          # linux/arm64 (on ubuntu-24.04-arm) only if a target node needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}-build-cache:orange-buffalo
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}-build-cache:orange-buffalo,mode=max,compression=zstd
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ github.ref_name }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
