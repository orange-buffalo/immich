name: Fork Docker

# Fork-owned build of the Immich server image.
#
# The upstream `docker.yml` cannot run here: its `pre-job` needs the immich-app
# `PUSH_O_MATIC` GitHub App secrets, and the ML matrix pins the `rocm` variant to
# immich-app's self-hosted `pokedex-large` runner. This workflow builds only the
# server image (web + CLI + plugins are baked into it) and pushes it to the
# fork's own GHCR namespace. The machine-learning image is unmodified in this
# fork, so the deployment keeps pulling it from ghcr.io/immich-app.
#
# See FORK.md for the full ledger of fork changes and the version-bump process.

on:
  push:
    branches: [orange-buffalo]
  workflow_dispatch:

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/immich-server

jobs:
  server:
    name: Build and Push Server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate docker image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=commit-

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          # Single arch keeps the build under the hosted-runner budget. Add
          # linux/arm64 (on ubuntu-24.04-arm) only if a target node needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}-build-cache:orange-buffalo
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}-build-cache:orange-buffalo,mode=max,compression=zstd
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ github.ref_name }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
